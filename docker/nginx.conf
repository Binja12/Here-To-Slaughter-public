# The client is a single page; every path serves index.html. Port 3002 so
# the run book's http://localhost:3002 stays true inside Docker too.

# A browser that accepts WebP gets the "<name>.png.webp" twin the image build
# wrote next to each PNG (scripts/optimize-art.mjs): same pixels, about a
# tenth of the bytes. Anyone else gets the PNG.
map $http_accept $webp_suffix {
    default "";
    "~*image/webp" ".webp";
}

# Original fallback URLs carry per-file hashes from client/src/assetUrl.ts.
# Unversioned originals revalidate because masters can be replaced in place.
map $arg_v $art_cache_control {
    default "public, max-age=31536000, immutable";
    "" "no-cache";
}

server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed code and media paths are immutable. Missing assets must be 404s,
    # not the SPA HTML fallback (especially for old tabs after a deployment).
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ "^/generated/online-(art|music)/.+/[a-f0-9]{16}/[^/]+\.(webp|mp3)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /generated/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg)$ {
        add_header Cache-Control $art_cache_control always;
        add_header Vary Accept;
        try_files $uri$webp_suffix $uri =404;
    }

    location ~* \.(webp|gif|svg|woff2?|mp3|mp4)$ {
        add_header Cache-Control $art_cache_control always;
        try_files $uri =404;
    }
}
