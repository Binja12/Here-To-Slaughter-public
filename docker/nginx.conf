# The client is a single page; every path serves index.html. Port 3002 so
# the run book's http://localhost:3002 stays true inside Docker too.
server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Card art is big and immutable per build.
    location ~* \.(png|jpg|jpeg|webp|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
