# The client is a single page; every path serves index.html. Port 3002 so
# the run book's http://localhost:3002 stays true inside Docker too.
server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Card art is big and immutable per build.
    location ~* \.(png|jpg|jpeg|webp|gif|svg|woff2?)$ {
        # Art is replaced IN PLACE under the same file name (a redrawn card
        # keeps its url), so a browser must revalidate every time; nginx's
        # ETag makes that a 304. Seen live: a redrawn Winds of Change kept
        # showing its old scan for a whole session (2026-09-04).
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
