# The client is a single page; every path serves index.html. Port 3002 so
# the run book's http://localhost:3002 stays true inside Docker too.

# A browser that accepts WebP gets the "<name>.png.webp" twin the image build
# wrote next to each PNG (scripts/optimize-art.mjs): same pixels, about a
# tenth of the bytes. Anyone else gets the PNG.
map $http_accept $webp_suffix {
    default "";
    "~*image/webp" ".webp";
}

# Art is fetched as "...png?v=<hash of the PNG masters>" (client/src/assetUrl.ts),
# and that hash changes the moment a card is redrawn, so a versioned URL can
# be cached for good. Art is replaced IN PLACE under the same file name (a
# redrawn card keeps its url), so an UNversioned request must still
# revalidate every time. Seen live: a redrawn Winds of Change kept showing
# its old scan for a whole session (2026-09-04).
map $arg_v $art_cache_control {
    default "public, max-age=31536000, immutable";
    "" "no-cache";
}

server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg)$ {
        add_header Cache-Control $art_cache_control always;
        add_header Vary Accept;
        try_files $uri$webp_suffix $uri =404;
    }

    location ~* \.(webp|gif|svg|woff2?)$ {
        add_header Cache-Control $art_cache_control always;
    }
}
